substitutions:
  _REGION: us-east1
  _REPO: climbing-app
  _SERVICE: climbing-api

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:latest
      - -f
      - apps/api/Dockerfile
      - apps/api

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api

  # Apply EF migrations with a one-off Cloud Run Job (same image, unix socket, secret
  # and service account as the API service). Deploy only proceeds if this succeeds.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_SERVICE}-migrate
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=api-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:climbing-db
      - --set-env-vars=CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:${_REGION}:climbing-db,CLOUD_SQL_DB=climbing_db,CLOUD_SQL_USER=climbing_app
      - --set-secrets=CLOUD_SQL_PASSWORD=climbing-db-password:latest
      - --command=dotnet
      - --args=ClimbingApp.Api.dll,--migrate-only
      - --quiet

  - id: run-migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_SERVICE}-migrate
      - --region=${_REGION}
      - --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=api-service-account@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:climbing-db
      - --port=8080
      - --update-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET_NAME=$PROJECT_ID-climbing-images,CLOUD_SQL_CONNECTION_NAME=$PROJECT_ID:${_REGION}:climbing-db,CLOUD_SQL_DB=climbing_db,CLOUD_SQL_USER=climbing_app,FIREBASE_PROJECT_ID=$PROJECT_ID
      - --set-secrets=CLOUD_SQL_PASSWORD=climbing-db-password:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
